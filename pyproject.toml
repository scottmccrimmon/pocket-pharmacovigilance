[project]
name = "pocket-pharmacovigilance"
version = "0.1.0"
description = "LoRA fine-tuning a small open LLM for adverse-drug-event extraction (learning project)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "accelerate>=1.15.0",
    "anthropic>=1.11.0",
    "datasets>=5.0.1",
    "peft>=0.21.2",
    "python-dotenv>=1.2.4",
    "torch>=2.14.1",
    "transformers>=5.18.0",
    "trl>=1.14.1",
    "wandb>=0.30.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ade"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "detect-secrets>=1.5.0",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]
